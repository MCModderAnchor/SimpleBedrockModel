//    token = System.getenv("MODRINTH_TOKEN")
//
//    projectId = mod_id
//    versionName = "${mod_id}-${version}"
//    versionNumber = mod_version
//    uploadFile = "${buildDir}/libs/${mod_id}-${version}.jar"
//    additionalFiles = ["${buildDir}/libs/${mod_id}-${version}-sources.jar"]
//    gameVersions = [minecraft_version]
//    //debugMode = true
//}

jar {
    archiveClassifier.set('min')
    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : mod_authors,
                "Specification-Version"   : version,
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    exclude 'example/**'
    exclude 'assets/example/**'
    exclude 'data/example/**'
    finalizedBy 'reobfJar'
}

tasks.named('jarJar', Jar).configure {
    // 取消 -all 后缀
    archiveClassifier.set('')
    exclude 'example/**'
    exclude 'assets/example/**'
    exclude 'data/example/**'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

java {
    // 编译源码文件，方便发布 maven
    withSourcesJar()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId = project.group
            artifactId = archivesBaseName
            version = project.version

            artifact tasks.named('jarJar')
            artifact tasks.named('sourcesJar')

            pom {
                name = mod_name
                description = mod_description
                licenses {
                    license {
                        name = mod_license
                    }
                }
            }
        }
    }
}

tasks.withType(PublishToMavenRepository).configureEach {
    dependsOn tasks.named('reobfJarJar')
}

tasks.withType(PublishToMavenLocal).configureEach {
    dependsOn tasks.named('reobfJarJar')
}